name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy<2" cython

      - name: Install project dependencies (incl. madmom from source)
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build exe
        run: >
          python -m PyInstaller main.py
          --name TempoExtractorAI
          --windowed
          --onedir
          --noconfirm
          --collect-all madmom
          --collect-all imageio_ffmpeg
          --collect-all matplotlib
          --collect-all mido

      - name: Zip build output
        run: powershell Compress-Archive -Path dist/TempoExtractorAI -DestinationPath TempoExtractorAI-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: TempoExtractorAI-win64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy<2" cython

      - name: Install project dependencies (incl. madmom from source)
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build app
        run: >
          python -m PyInstaller main.py
          --name TempoExtractorAI
          --windowed
          --onedir
          --noconfirm
          --collect-all madmom
          --collect-all imageio_ffmpeg
          --collect-all matplotlib
          --collect-all mido

      - name: Zip build output
        run: |
          cd dist
          zip -r ../TempoExtractorAI-macos.zip TempoExtractorAI.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: TempoExtractorAI-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build/TempoExtractorAI-win64.zip
            macos-build/TempoExtractorAI-macos.zip
